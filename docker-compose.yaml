services:

  postgres_db:
    image: postgres:15-alpine
    container_name: todo_postgres_compose
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 5

  tasks_db_migrations:
    image: migrate/migrate
    restart: "no"
    volumes:
      - ./todo-tasks/migrations:/migrations
    command: -path=/migrations -database="${TASKS_DB_URL}" up
    depends_on:
      postgres_db:
        condition: service_healthy
      

  users_db_migrations:
    image: migrate/migrate
    restart: "no"
    volumes:
      - ./todo-users/migrations:/migrations
    command: -path=/migrations -database="${USERS_DB_URL}" up
    depends_on:
      postgres_db:
        condition: service_healthy

  redis_db:
    image: redis:7-alpine
    container_name: todo_redis_compose
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  todo-users:
    build:
      context: .
      dockerfile: todo-users/Dockerfile
    container_name: todo_users_compose
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "9090:9090"
    depends_on:
      users_db_migrations:
        condition: service_completed_successfully
      redis_db:
        condition: service_started
    environment:
      SERVER_PORT: "8080"
      GRPC_PORT: "9090"
      DATABASE_URL: "${USERS_DB_URL}"
      REDIS_HOST: "redis_db"
      REDIS_PORT: "6379"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN}"
      GMAIL_CLIENT_ID: ${GMAIL_CLIENT_ID}
      GMAIL_CLIENT_SECRET: ${GMAIL_CLIENT_SECRET}
      GMAIL_REFRESH_TOKEN: ${GMAIL_REFRESH_TOKEN}
      GMAIL_FROM: ${GMAIL_FROM}

  todo-tasks:
    build:
      context: .
      dockerfile: todo-tasks/Dockerfile
    container_name: todo_tasks_compose
    restart: unless-stopped
    ports:
      - "8081:8081"
      - "9091:9091"
    depends_on:
      tasks_db_migrations:
        condition: service_completed_successfully
      todo-users:
        condition: service_started
    environment:
      SERVER_PORT: "8081"
      GRPC_PORT: "9091"
      DATABASE_URL: "${TASKS_DB_URL}"
      USER_SERVICE_GRPC_ADDR: "todo-users:9090"

  todo-telegram:
    build:
      context: .
      dockerfile: todo-telegram/Dockerfile
    container_name: todo_telegram_compose
    restart: unless-stopped
    sysctls:
    - net.ipv6.conf.all.disable_ipv6=1
    depends_on:
      - todo-tasks
      - todo-users
    environment:
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN}"
      TASK_SERVICE_GRPC_ADDR: "todo-tasks:9091"
      USER_SERVICE_GRPC_ADDR: "todo-users:9090"

  nginx:
    image: nginx:alpine
    container_name: todo_nginx_compose
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - todo-users
      - todo-tasks

volumes:
  pgdata:
  redisdata: