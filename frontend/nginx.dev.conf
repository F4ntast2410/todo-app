server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index views/dashboard.html;

    # Статика фронтенда (с возможностью горячей перезагрузки)
    location / {
        try_files $uri $uri/ /views/dashboard.html;
    }

    # Сервис пользователей и авторизации
    location /api/auth {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://todo-users:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Сервис задач
    location /api/tasks {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://todo-tasks:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}