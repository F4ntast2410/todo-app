# 1. Сброс соединений для прямого обращения по IP или сторонним доменам
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate /etc/letsencrypt/live/todo42.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/todo42.duckdns.org/privkey.pem;

    return 444;
}

# 2. Редирект с HTTP на HTTPS для вашего домена
server {
    listen 80;
    server_name todo42.duckdns.org;

    return 301 https://$host$request_uri;
}

# 3. Основной SSL-сервер
server {
    listen 443 ssl;
    server_name todo42.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/todo42.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/todo42.duckdns.org/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index views/dashboard.html;

    # Статика фронтенда
    location / {
        try_files $uri $uri/ /views/dashboard.html;
    }

    # Сервис пользователей и авторизации
    location /api/auth {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://todo-users:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Сервис задач
    location /api/tasks {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://todo-tasks:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}