server {
    # 1. Какой порт слушать наружу
    listen 80;
    server_name localhost;

    # 2. Раздача фронтенда (Статика)
    location / {
        root /usr/share/nginx/html;
        index views/dashboard.html;
        try_files $uri $uri/ /views/dashboard.html;
    }

    # 3. Перенаправление на Go-бэкенд (API)
    location /api/auth {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://todo-users:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /api/tasks {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://todo-tasks:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}